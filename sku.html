    <script type="module" src="https://pyscript.net/releases/2023.11.1/core.js"></script>
    

    <script type="py" src="main.py"></script>
    <style>
.navbar{
    background-color: brown;
    font-family: 'Times New Roman', Times, serif;
}

.container{
    background-color: beige;
    font-family: 'Times New Roman', Times, serif;
}

</head>
<body>

    <div id="container">
        <nav class="navbar navbar-expand-sm navbar" id="navbar">
            <div class="container-fluid">
                <a class="navbar-brand" href="#"></a>
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link text-light" href="sku.html" target="_self">SKU Generator</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-light" href="index.html" target="_self">RECEIPT Generator</a>
                    </li>
                </ul>
            </div>
        </nav>
    </div>

    <div class="container mt-4">
        <h1>OBMC ENTREP FAIR 2627</h1>
        <h3>Group 3: Creme Factory</h3>

        <div class="mt-4">
            <h2>SKU GENERATOR</h2>

            <div class="mb-3">
                <label for="category" class="form-label">Category</label>
                <select id="category" class="form-select">
                    <option value="Mini_Cheesecakes">Mini Cheesecakes</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="product_name" class="form-label">Product Name</label>
                <input type="text" id="product_name" class="form-control" placeholder="i.e.: Biscoff Cheesecake">
            </div>

            <div class="mb-3">
                <label for="quantity" class="form-label">Stock Quantity</label>
                <input type="text" id="quantity" class="form-control" placeholder="Please place an amount here.">
            </div>

            <button type="button" class="btn" py-click="SKU_generator">
                GENERATE SKU
            </button>
        </div>

      
        <div id="sku_output" class="container mt-4"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
